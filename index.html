<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Museum Mpu Tantular — tur 360° interaktif Museum Mpu Tantular Sidoarjo: pameran bermain, panorama asli, dan rute interaktif." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Pameran Bermain · Museum Mpu Tantular</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('mpu-tantular-a11y');
          if (raw) {
            var prefs = JSON.parse(raw);
            if (prefs.contrast === 'high')
              document.documentElement.dataset.contrast = 'high';
            if (prefs.textSize === 'lg' || prefs.textSize === 'xl')
              document.documentElement.dataset.textSize = prefs.textSize;
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
